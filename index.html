<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>宇宙藏书阁读书会 邀请函</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700&family=Cinzel:wght@400;600&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      font-family: 'Noto Serif SC', serif;
      background: #0c1427;
      color: #E8D9A3;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }

    .page-container {
      width: 210mm;
      height: 297mm;
      background: url('src/background.png') no-repeat center center;
      background-size: cover;
      position: relative;
      box-shadow: 0 10px 40px rgba(0, 0, 0, 0.5);
      border-radius: 6px;
    }

    .content-wrapper {
      position: absolute;
      top: 8%;
      left: 10%;
      right: 10%;
      bottom: 8%;
      display: flex;
      flex-direction: column;
      justify-content: space-between;
      text-align: center;
    }

    /* Logo + Title */
    .header-section {
      margin-bottom: 1.5rem;
    }

    .logo {
      width: 120px;
      margin: 0 auto 1rem;
      display: block;
      filter: drop-shadow(0 0 20px rgba(215, 181, 106, 0.6));
    }

    .invitation-title h1 {
      font-size: 2rem;
      font-weight: 700;
      color: #FFD700;
      letter-spacing: 3px;
      margin-bottom: 0.3rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.5);
    }

    .invitation-title .subtitle {
      font-family: 'Cinzel', serif;
      font-size: 0.9rem;
      color: #E8D9A3;
      letter-spacing: 3px;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
    }

    /* Greeting and text */
    .greeting {
      font-size: 1.1rem;
      color: #FFD700;
      font-weight: 600;
      margin-bottom: 1rem;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
    }

    .invitation-text {
      font-size: 1rem;
      line-height: 1.8;
      color: #E8D9A3;
      text-shadow: 0 1px 4px rgba(0, 0, 0, 0.6);
      margin-bottom: 1.2rem;
    }

    /* CTA box */
    .invitation-cta {
      background: rgba(255, 215, 0, 0.12);
      border: 2px solid rgba(255, 215, 0, 0.6);
      border-radius: 14px;
      padding: 1.2rem;
      margin: 1rem auto 1.5rem;
      max-width: 85%;
      box-shadow: 0 0 25px rgba(255, 215, 0, 0.25);
    }

    .invitation-cta-text {
      color: #FFD700;
      font-size: 1.2rem;
      font-weight: 700;
      text-shadow: 0 2px 8px rgba(0, 0, 0, 0.6);
      letter-spacing: 1px;
    }

    /* Benefits */
    .benefits h3 {
      font-size: 1.05rem;
      color: #FFD700;
      margin-bottom: 0.8rem;
      text-shadow: 0 2px 6px rgba(0, 0, 0, 0.6);
    }

    .benefits ul {
      list-style: none;
      padding: 0;
      width: fit-content;
      margin: 0 auto;
      text-align: left;
    }

    .benefits li {
      font-size: 0.95rem;
      padding: 0.3rem 0;
      position: relative;
      padding-left: 1.4rem;
      color: #E8D9A3;
    }

    .benefits li::before {
      content: '✦';
      position: absolute;
      left: 0;
      color: #FFD700;
    }

    /* Contact */
    .contact-section {
      display: flex;
      justify-content: center;
      gap: 3rem;
      align-items: center;
      margin-top: 2rem;
    }

    .contact-item {
      text-align: center;
    }

    .contact-item h4 {
      color: #FFD700;
      font-size: 1rem;
      margin-bottom: 0.8rem;
      text-shadow: 0 1px 5px rgba(0, 0, 0, 0.6);
    }

    .qr-code {
      width: 150px;
      border-radius: 10px;
      background: white;
      padding: 6px;
      box-shadow: 0 3px 10px rgba(0, 0, 0, 0.4);
    }

    .email-link {
      color: #E8D9A3;
      font-size: 0.9rem;
      text-decoration: none;
      padding: 0.5rem 0.8rem;
      border: 1px solid rgba(255, 215, 0, 0.5);
      border-radius: 10px;
      transition: 0.3s;
    }

    .email-link:hover {
      color: #FFD700;
      border-color: #FFD700;
      box-shadow: 0 0 10px rgba(255, 215, 0, 0.4);
    }

    @media print {
      .page-container { box-shadow: none; }
    }
  </style>
</head>
<body>
  <div class="page-container">
    <div class="content-wrapper">
      <div class="header-section">
        <img src="src/logo/round.PNG" alt="宇宙藏书阁" class="logo" />
        <div class="invitation-title">
          <h1>宇宙藏书阁读书会</h1>
          <p class="subtitle">COSMIC LIBRARY READING CLUB</p>
        </div>
      </div>

      <div>
        <p class="greeting">致每一位探寻真理的灵魂：</p>
        <div class="invitation-text">
          <p>若你渴望探索生命的奥秘与宇宙的真相，</p>
          <p>若你追求心灵成长与意识觉醒，</p>
          <p>若你希望在喧嚣中寻得平静与智慧——</p>
        </div>

        <div class="invitation-cta">
          <p class="invitation-cta-text">宇宙藏书阁读书会诚挚邀请您的加入</p>
        </div>

        <div class="benefits">
          <h3>在这里，您将体验</h3>
          <ul>
            <li>接触更高意识层的宇宙智慧文献</li>
            <li>与志同道合者共修共悟，共享成长</li>
            <li>展开一段与宇宙对话的奇妙旅程</li>
          </ul>
        </div>
      </div>

      <div class="contact-section">
        <div class="contact-item">
          <h4>扫码加入 WhatsApp 群组</h4>
          <img src="src/QR code/whatsapp.png" alt="WhatsApp QR" class="qr-code" />
        </div>
        <div class="contact-item">
          <h4>或通过邮件联系我们</h4>
          <a href="mailto:cosmiclibrary363@gmail.com" class="email-link">cosmiclibrary363@gmail.com</a>
        </div>
      </div>
    </div>
  </div>
</body>
</html>
